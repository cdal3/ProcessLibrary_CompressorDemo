     "Button with label to navigate to faceplate using suffix.  Ref_BaseTag is linked to the current instruction backing tag.  The target tagname and path is derived from the base tag and suffix combined.  The dialog box name is derived from data in the target backing tag.","Button with label to navigate to faceplate using suffix.  Ref_BaseTag is linked to the current instruction backing tag.  The target tagname and path is derived from the base tag and suffix combined.  The dialog box name is derived from data in the target backing tag.","Pulsante con etichetta per passare al faceplate utilizzando il suffisso.  Ref_BaseTag è collegato al tag di supporto dell'istruzione corrente.  Il nome del tag di destinazione e il percorso di destinazione derivano dalla combinazione del tag di base e del suffisso.Il nome della finestra di dialogo deriva dai dati nel tag di backing di destinazione.","带标签的按钮，用于通过后缀导航至面板。Ref_BaseTag 链接到当前指令后备标签。目标标签名称和路径由基础标签和后缀组合而成。对话框名称来源于目标后备标签中的数据。","Schaltfläche mit Beschriftung zum Navigieren zur Faceplate mit Suffix. Ref_BaseTag ist mit dem aktuellen Instruktions-Backing-Tag verknüpft. Der Ziel-Tagname und -Pfad wird aus der Kombination von Basis-Tag und Suffix abgeleitet. Der Name des Dialogfelds wird aus den Daten im Instruktions-Backing-Tag abgeleitet.","접미사를 사용하여 페이스플레이트로 이동하는 레이블이 있는 단추입니다. Ref_BaseTag는 현재 명령어 지원 태그에 연결되어 있습니다. 대상 태그 이름과 경로는 기본 태그와 접미사가 결합되어 파생됩니다. 대화 상자 이름은 대상 지원 태그의 데이터에서 파생됩니다.","Bouton avec étiquette pour naviguer vers la façade à l’aide d’un suffixe. Ref_BaseTag est liée à la balise de sauvegarde de l’instruction courante. Le nom et le chemin de la balise cible sont dérivés de la combinaison de la balise de base et du suffixe. Le nom de la boîte de dialogue est dérivé des données de la balise de sauvegarde cible.","Botão com rótulo para navegar até o faceplate usando o sufixo. Ref_BaseTag está vinculado à tag de apoio da instrução atual. O nome e o caminho da tag de destino são derivados da tag base e do sufixo combinados. O nome da caixa de diálogo é derivado dos dados na tag de apoio de destino.","Botón con etiqueta para navegar al faceplate usando el sufijo. Ref_BaseTag está vinculado a la etiqueta de respaldo de instrucción actual. El nombre y la ruta de acceso de la etiqueta de destino se derivan de la etiqueta base y el sufijo combinados. El nombre del cuadro de diálogo se deriva de los datos de la etiqueta de respaldo de destino.",
     "Button with label to navigate to faceplate using tag.  The instruction backing tag is linked to Ref_Tag, and the dialog box name is derived from data stored in the instruction backing tag.","Button with label to navigate to faceplate using tag.  The instruction backing tag is linked to Ref_Tag, and the dialog box name is derived from data stored in the instruction backing tag.","Pulsante con etichetta per passare al faceplate utilizzando il tag.  Il tag di backing dell'istruzione è collegato a Ref_Tag e il nome della finestra di dialogo deriva dai dati memorizzati nel tag di backing dell'istruzione.","带标签的按钮，通过标签导航至面板。指令后备标签链接到 Ref_Tag，对话框名称来源于指令后备标签中存储的数据。","Schaltfläche mit Beschriftung zum Navigieren zur Faceplate mit Tag. Das Instruktions-Backing-Tag ist mit Ref_Tag verknüpft, und der Dialogfeldname wird aus den im Instruktions-Backing-Tag gespeicherten Daten abgeleitet.","태그를 사용하여 페이스플레이트로 이동하는 레이블이 있는 단추입니다. 명령어 지원 태그는 Ref_Tag에 연결되어 있으며, 대화 상자 이름은 명령어 지원 태그에 저장된 데이터에서 파생됩니다.","Bouton avec étiquette pour naviguer vers la façade à l’aide d’une balise. La balise de sauvegarde de l’instruction est liée à Ref_Tag, et le nom de la boîte de dialogue est dérivé des données stockées dans la balise de sauvegarde de l’instruction.","Botão com rótulo para navegar até o faceplate usando tag. A tag de apoio da instrução está vinculada a Ref_Tag e o nome da caixa de diálogo é derivado dos dados armazenados na tag de apoio da instrução.","Botón con etiqueta para navegar al faceplate usando tag. La etiqueta de respaldo de instrucción está vinculada a Ref_Tag y el nombre del cuadro de diálogo se deriva de los datos almacenados en la etiqueta de respaldo de instrucción.",
