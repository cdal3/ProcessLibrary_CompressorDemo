     "Button with icon to navigate to dialog box explicitly. The instruction backing tag is linked to Ref_Tag, and the dialog box is specified by Cfg_DialogBox.","Button with icon to navigate to dialog box explicitly. The instruction backing tag is linked to Ref_Tag, and the dialog box is specified by Cfg_DialogBox.","Pulsante con icona per accedere in modo esplicito alla finestra di dialogo. Il tag di backup dell'istruzione è collegato a Ref_Tag e la finestra di dialogo è specificata da Cfg_DialogBox.","带图标的按钮，用于显式导航到对话框。指令备用标签链接到 Ref_Tag，且对话框由 Cfg_DialogBox 指定。","Schaltfläche mit Symbol zum expliziten Navigieren zum Dialogfeld. Das Anweisungs-Backing-Tag ist mit Ref_Tag verknüpft, und das Dialogfeld wird durch Cfg_DialogBox angegeben.","아이콘이 있는 단추로 명시적으로 대화 상자로 이동합니다. 명령어 지원 태그는 Ref_Tag에 연결되고, 대화 상자는 Cfg_DialogBox로 지정됩니다.","Bouton avec icône pour accéder explicitement à la boîte de dialogue. La balise de sauvegarde de l’instruction est liée à Ref_Tag et la boîte de dialogue est spécifiée par Cfg_DialogBox.","Botão com ícone para navegar para a caixa de diálogo explicitamente. A tag de apoio da instrução está vinculada a Ref_Tag e a caixa de diálogo é especificada por Cfg_DialogBox.","Botón con icono para navegar al cuadro de diálogo explícitamente. La etiqueta de respaldo de la instrucción está vinculada a Ref_Tag y el cuadro de diálogo se especifica mediante Cfg_DialogBox.",
     "Button with icon to navigate to faceplate using string.  String variable linked to Ref_Nav contains the full path to an instruction backing tag. The dialog box name is derived from data in the instruction backing tag.","Button with icon to navigate to faceplate using string.  String variable linked to Ref_Nav contains the full path to an instruction backing tag. The dialog box name is derived from data in the instruction backing tag.","Pulsante con icona per passare al frontalino utilizzando la stringa.La variabile stringa collegata a Ref_Nav contiene il percorso completo di un tag di backup dell'istruzione. Il nome della finestra di dialogo deriva dai dati nel tag di backup dell'istruzione.","带图标的按钮，通过字符串导航至面板。链接到 Ref_Nav 的字符串变量包含指令备用标签的完整路径。对话框名称来源于指令支持标签中的数据。","Schaltfläche mit Symbol zum Navigieren zur Faceplate mithilfe einer Zeichenfolge. Die mit Ref_Nav verknüpfte Zeichenfolgenvariable enthält den vollständigen Pfad zu einem Befehlsunterstützungs-Tag. Der Name des Dialogfelds wird aus den Daten im Instruktions-Backing-Tag abgeleitet.","문자열을 사용하여 페이스플레이트로 이동하는 아이콘이 있는 버튼입니다. Ref_Nav에 연결된 문자열 변수에는 명령어 지원 태그의 전체 경로가 포함되어 있으며, 대화 상자 이름은 명령어 지원 태그의 데이터에서 파생됩니다.","Bouton avec icône pour accéder à la façade à l’aide d’une chaîne. Variable de chaîne liée à Ref_Nav contient le chemin complet vers une balise de sauvegarde d’instruction. Le nom de la boîte de dialogue est dérivé des données de la balise de sauvegarde de l’instruction.","Botão com ícone para navegar até o faceplate usando string. A variável String vinculada a Ref_Nav contém o caminho completo para uma tag de apoio da instrução. O nome da caixa de diálogo é derivado dos dados na tag de apoio da instrução.","Botón con icono para navegar al faceplate usando string. Variable string vinculada a Ref_Nav contiene la ruta de acceso completa a una tag de respaldo de instrucción. El nombre del cuadro de diálogo se deriva de los datos de la tag de respaldo de la instrucción.",
     "Button with icon to navigate to faceplate using suffix.  Ref_BaseTag is linked to the current instruction backing tag.  The target tagname and path is derived from the base tag and suffix combined.  The dialog box name is derived from data in the target backing tag.","Button with icon to navigate to faceplate using suffix.  Ref_BaseTag is linked to the current instruction backing tag.  The target tagname and path is derived from the base tag and suffix combined.  The dialog box name is derived from data in the target backing tag.","Pulsante con icona per passare al frontalino utilizzando il suffisso.Ref_BaseTag è collegato al tag di supporto dell'istruzione corrente.  Il nome del tag di destinazione e il percorso di destinazione derivano dalla combinazione del tag di base e del suffisso.Il nome della finestra di dialogo deriva dai dati nel tag di backing di destinazione.","带图标的按钮，用于通过后缀导航至面板。Ref_BaseTag 链接到当前指令后备标签。目标标签名称和路径由基础标签和后缀组合而成。对话框名称来源于目标后备标签中的数据。","Schaltfläche mit Symbol zum Navigieren zur Faceplate mit Suffix. Ref_BaseTag ist mit dem aktuellen Backing-Tag verknüpft. Der Ziel-Tagname und -Pfad wird aus der Kombination von Basis-Tag und Suffix abgeleitet. Der Name des Dialogfelds wird aus den Daten im Ziel-Backing-Tag abgeleitet.","접미사를 사용하여 페이스플레이트로 이동하는 아이콘이 있는 단추입니다. Ref_BaseTag는 현재 명령어 지원 태그에 연결되어 있습니다. 대상 태그 이름과 경로는 기본 태그와 접미사가 결합되어 파생됩니다. 대화 상자 이름은 대상 지원 태그의 데이터에서 파생됩니다.","Bouton avec icône pour accéder à la façade à l’aide d’un suffixe. Ref_BaseTag est liée à la balise de sauvegarde de l’instruction courante. Le nom et le chemin de la balise cible sont dérivés de la combinaison de la balise de base et du suffixe. Le nom de la boîte de dialogue est dérivé des données de la balise de sauvegarde cible.","Botão com ícone para navegar até o faceplate usando o sufixo. Ref_BaseTag está vinculado à tag de apoio da instrução atual. O nome e o caminho da tag de destino são derivados da tag base e do sufixo combinados. O nome da caixa de diálogo é derivado dos dados na tag de apoio de destino.","Botón con icono para navegar al faceplate usando el sufijo. Ref_BaseTag está vinculado a la etiqueta de respaldo de instrucción actual. El nombre y la ruta de acceso de la etiqueta de destino se derivan de la etiqueta base y el sufijo combinados. El nombre del cuadro de diálogo se deriva de los datos de la etiqueta de respaldo de destino.",
