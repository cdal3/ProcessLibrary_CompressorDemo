     "Display the value as 'primary' data:  False = Normal weight with value font size equal to Set_SessionFontSize, True = Bold weight with value font size 20% larger than Set_SessionFontSize.","Display the value as 'primary' data:  False = Normal weight with value font size equal to Set_SessionFontSize, True = Bold weight with value font size 20% larger than Set_SessionFontSize.","Visualizza il valore come dati 'primari':Falso = peso normale con dimensione del carattere del valore uguale a Set_SessionFontSize, Vero = peso grassetto con dimensione del carattere del valore superiore del 20% rispetto a Set_SessionFontSize.","将值显示为“主要”数据：假 = 正常粗细，值字体大小等于 Set_SessionFontSize，真 = 粗体粗细，值字体大小比 Set_SessionFontSize 大 20%。","\"Den Wert als \"\"primäre\"\" Daten anzeigen: False = Normalgewichtung mit einer Schriftgröße gleich Set_SessionFontSize, True = Fettdruck mit einer Schriftgröße, die 20 % größer als Set_SessionFontSize ist.\"","값을 'primary' 데이터로 표시: False = 값 글꼴 크기가 Set_SessionFontSize인 보통 두께, True = 값 글꼴 크기가 Set_SessionFontSize보다 20% 큰 굵은 두께.","Afficher la valeur sous forme de données « primaires » : Faux = Épaisseur normale avec une taille de police de valeur égale à Set_SessionFontSize, Vrai = Épaisseur en gras avec une taille de police de valeur supérieure de 20 % à Set_SessionFontSize.","Exibir o valor como dados 'primários': Falso = Peso normal com tamanho da fonte de valor igual a Set_SessionFontSize, Verdadeiro = Peso em negrito com tamanho de fonte de valor 20% maior que Set_SessionFontSize.","Mostrar el valor como datos 'primarios': Falso = Peso normal con tamaño de fuente igual a Set_SessionFontSize, Verdadero = Peso en negrita con tamaño de fuente un 20% mayor que Set_SessionFontSize.",
