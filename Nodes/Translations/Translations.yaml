     "Navigation to a Smart Device Object","Navigation to a Smart Device Object","Navigazione a un oggetto Smart Device","导航到智能设备对象","Navigation zu einem Smart-Device-Objekt","스마트 장치 개체로 이동","Navigation vers un objet de dispositif intelligent.","Navegação para um objeto de dispositivo inteligente","Navegación a un objeto de dispositivo inteligente.",
     "Nominal font size set for the session by the applied stylesheet.","Nominal font size set for the session by the applied stylesheet.","Dimensione nominale del carattere impostata per la sessione dal foglio di stile applicato.","由应用的样式表为会话设置的名义字体大小。","Nominale Schriftgröße, die durch das angewendete Stylesheet für die Sitzung festgelegt wird.","적용된 스타일시트에 의해 세션에 대해 설정된 공칭 글꼴 크기입니다.","Taille de police nominale définie pour la session par la feuille de style appliquée.","Tamanho nominal da fonte definido para a sessão pela folha de estilo aplicada.","Tamaño de fuente nominal establecido para la sesión por la hoja de estilos aplicada.",
     "Note that the linear gauge starts at 0, even though the minimum value is 1.  If you start at 1, then the intermediate values turn to decimals and that is not desirable.","Note that the linear gauge starts at 0, even though the minimum value is 1.  If you start at 1, then the intermediate values turn to decimals and that is not desirable.","Si noti che l'indicatore lineare inizia da 0, anche se il valore minimo è 1.Se si parte da 1, i valori intermedi si trasformano in decimali e questo non è auspicabile.","请注意，线性仪表从 0 开始，即使最小值为 1。如果从 1 开始，则中间值将变为小数，这是不可取的。","Beachten Sie, dass die lineare Anzeige bei 0 beginnt, obwohl der Mindestwert 1 ist. Wenn Sie bei 1 beginnen, werden die Zwischenwerte zu Dezimalwerten, und das ist nicht wünschenswert.","선형 게이지는 최소값이 1이어도 0에서 시작합니다.  1에서 시작하면 중간 값이 소수로 바뀌며 이는 바람직하지 않습니다.","Notez que la jauge linéaire commence à 0, même si la valeur minimale est 1. Si vous commencez à 1, les valeurs intermédiaires se transforment en décimales et ce n’est pas souhaitable.","Observe que o medidor linear começa em 0, mesmo que o valor mínimo seja 1. Se você começar em 1, os valores intermediários se transformarão em decimais e isso não é desejável.","Tenga en cuenta que el indicador lineal comienza en 0, aunque el valor mínimo sea 1. Si comienzas en 1, entonces los valores intermedios se convierten en decimales y eso no es deseable.",
