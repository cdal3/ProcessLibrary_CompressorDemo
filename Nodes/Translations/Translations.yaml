     "How many positions: 4, 6, 8","How many positions: 4, 6, 8","Quante posizioni: 4, 6, 8","位数：4、6、8","Wie viele Positionen: 4, 6, 8","위치 수: 4, 6, 8","Combien de positions : 4, 6, 8","Quantas posições: 4, 6, 8","Cuántas posiciones: 4, 6, 8",
     "If the dialog box is triggered by a tag that already contains a suffix, such as _Prompt, and that suffix needs to be replaced by the items in \"Suffix_Tags\", enter the lenth of the suffix to be replaced (including underscores).  The length must include all characters in the suffix, including special characters like underscores (_).  For example, if the dialog box was called for \"MyTag_Prompt\" and you need to load tag \"MyTag_Energy\", enter the number of characters in \"_Prompt\".","If the dialog box is triggered by a tag that already contains a suffix, such as _Prompt, and that suffix needs to be replaced by the items in \"Suffix_Tags\", enter the lenth of the suffix to be replaced (including underscores).  The length must include all characters in the suffix, including special characters like underscores (_).  For example, if the dialog box was called for \"MyTag_Prompt\" and you need to load tag \"MyTag_Energy\", enter the number of characters in \"_Prompt\".","Se la finestra di dialogo viene attivata da un tag che contiene già un suffisso, ad esempio _Prompt, e tale suffisso deve essere sostituito dagli elementi in \"Suffix_Tags\", immettere la lunghezza del suffisso da sostituire (inclusi i caratteri di sottolineatura).  La lunghezza deve includere tutti i caratteri del suffisso, inclusi i caratteri speciali come i caratteri di sottolineatura (_).  Ad esempio, se la finestra di dialogo è stata richiamata per \"MyTag_Prompt\" ed è necessario caricare il tag \"MyTag_Energy\", immettere il numero di caratteri in \"_Prompt\".","如果对话框由已包含后缀（如 _Prompt）的标签触发，且该后缀需要替换为“Suffix_Tags”中的项，请输入要替换后缀的长度（包括下划线）。长度必须包含后缀中的所有字符，包括下划线（_）等特殊字符。例如，如果对话框被调用为“MyTag_Prompt”，并且您需要加载标签“MyTag_Energy”，请输入“_Prompt”的字符数。","Wenn das Dialogfeld durch ein Tag ausgelöst wird, das bereits ein Suffix enthält, z. B. _Prompt, und dieses Suffix durch die Elemente in \"Suffix_Tags\" ersetzt werden muss, geben Sie die Länge des zu ersetzenden Suffixes (einschließlich Unterstrichen) ein. Die Länge muss alle Zeichen im Suffix enthalten, einschließlich Sonderzeichen wie Unterstriche (_). Wenn das Dialogfeld z. B. für \"MyTag_Prompt\" aufgerufen wurde und Sie das Tag \"MyTag_Energy\" laden müssen, geben Sie die Anzahl der Zeichen im Suffix \"_Prompt\" ein.","0","Si la boîte de dialogue est déclenchée par une balise qui contient déjà un suffixe, tel que _Prompt, et que ce suffixe doit être remplacé par les éléments de « Suffix_Tags », entrez la longueur du suffixe à remplacer (y compris les traits de soulignement). La longueur doit inclure tous les caractères du suffixe, y compris les caractères spéciaux comme les traits de soulignement (_). Par exemple, si la boîte de dialogue a été appelée pour « MyTag_Prompt » et que vous devez charger la balise « MyTag_Energy », entrez le nombre de caractères dans « _Prompt ».","Se a caixa de diálogo for acionada por uma tag que já contém um sufixo, como _Prompt, e esse sufixo precisar ser substituído pelos itens em \"Suffix_Tags\", insira o comprimento do sufixo a ser substituído (incluindo os sublinhados). O comprimento deve incluir todos os caracteres do sufixo, inclusive caracteres especiais como sublinhados (_). Por exemplo, se a caixa de diálogo foi chamada para \"MyTag_Prompt\" e você precisa carregar a tag \"MyTag_Energy\", informe o número de caracteres em \"_Prompt\".","Si el cuadro de diálogo se activa con una etiqueta que ya contiene un sufijo, como _Prompt, y ese sufijo debe reemplazarse por los elementos de \"Suffix_Tags\", escriba la longitud del sufijo que se va a reemplazar (incluidos los guiones bajos).  La longitud debe incluir todos los caracteres del sufijo, incluidos los caracteres especiales como guiones bajos (_).  Por ejemplo, si se llamó al cuadro de diálogo \"MyTag_Prompt\" y necesita cargar la etiqueta \"MyTag_Energy\", introduzca el número de caracteres en \"_Prompt\".",
