     "Button (without label / icon) to navigate to faceplate using string.  String variable linked to Ref_Nav contains the full path to an instruction backing tag. The dialog box name is derived from data in the instruction backing tag.","Button (without label / icon) to navigate to faceplate using string.  String variable linked to Ref_Nav contains the full path to an instruction backing tag. The dialog box name is derived from data in the instruction backing tag.","Pulsante (senza etichetta/icona) per passare al frontalino utilizzando la stringa.  La variabile stringa collegata a Ref_Nav contiene il percorso completo di un tag di backup dell'istruzione. Il nome della finestra di dialogo deriva dai dati nel tag di backup dell'istruzione.","按钮（无标签/图标），通过字符串导航至面板。链接到 Ref_Nav 的字符串变量包含指令备用标签的完整路径。对话框名称来源于指令支持标签中的数据。","Schaltfläche (ohne Beschriftung / Symbol) zum Navigieren zur Faceplate mittels Zeichenfolge.  Die mit Ref_Nav verknüpfte Zeichenfolgenvariable enthält den vollständigen Pfad zu einem Instruktions-Backing-Tag. Der Name des Dialogfelds wird aus den Daten im  Instruktions-Backing-Tag abgeleitet.","문자열을 사용하여 페이스플레이트로 이동하는 버튼(레이블/아이콘 없음)입니다. Ref_Nav에 연결된 문자열 변수에는 명령어 지원 태그의 전체 경로가 포함되어 있으며, 대화 상자 이름은 명령어 지원 태그의 데이터에서 파생됩니다.","Bouton (sans étiquette / icône) pour accéder à la façade à l’aide d’une chaîne. Variable de chaîne liée à Ref_Nav contenant le chemin complet vers une balise de sauvegarde d’instruction. Le nom de la boîte de dialogue est dérivé des données de la balise de sauvegarde de l’instruction.","Botão (sem rótulo / ícone) para navegar até o faceplate usando string. A variável String vinculada a Ref_Nav contém o caminho completo para uma tag de apoio da instrução. O nome da caixa de diálogo é derivado dos dados na tag de apoio da instrução.","Botón (sin tag/icono) para navegar al faceplate usando string. Variable string vinculada a Ref_Nav contiene la ruta de acceso completa a una tag de respaldo de instrucción. El nombre del cuadro de diálogo se deriva de los datos de la tag de respaldo de instrucción.",
     "Button appearance when the device is already in the state which the button commands.","Button appearance when the device is already in the state which the button commands.","Aspetto del pulsante quando il dispositivo si trova già nello stato richiesto dal pulsante.","当设备处于按钮所指示状态时的按钮外观。","Darstellung der Schaltfläche, wenn sich das Gerät bereits in dem Zustand befindet, den die Schaltfläche steuert.","장치가 이미 버튼이 명령하는 상태에 있을 때의 버튼 모양입니다.","Apparence du bouton lorsque le dispositif est déjà à l’état commandé par le bouton.","Aparência do botão quando o dispositivo já está no estado em que o botão comanda.","Aspecto del botón cuando el dispositivo ya se encuentra en el estado que ordena el botón.",
