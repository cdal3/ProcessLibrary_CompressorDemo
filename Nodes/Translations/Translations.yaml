     "This base panel will load the appropriate help display for the object","This base panel will load the appropriate help display for the object","Questo pannello di base caricherà la visualizzazione della guida appropriata per l'oggetto.","此基本面板将加载对象的相应帮助显示","Dieser Basisbereich lädt die entsprechende Hilfeanzeige für das Objekt.","이 기본 패널은 개체에 대한 적절한 도움말 표시를 로드합니다.","Ce panneau de base chargera l’affichage d’aide approprié pour l’objet","Esse painel base carregará a exibição de ajuda apropriada para o objeto","Este panel base cargará la pantalla de ayuda adecuada para el objeto",
     "This folder contains widgets used for testing","This folder contains widgets used for testing","Questa cartella contiene i widget utilizzati per i test.","此文件夹包含用于测试的Widget 组件","Dieser Ordner enthält Widgets, die zum Testen verwendet werden.","이 폴더에는 테스트에 사용되는 위젯이 포함되어 있습니다.","Ce dossier contient les widgets utilisés pour les tests","Esta pasta contém widgets usados para testes","Esta carpeta contiene widgets utilizados para las pruebas",
     "This panel loader is designed to load the panel when the container (the advanced panel) becomes visible.  This improves performance in cases where the faceplate is called but the advanced panel is never displayed.  ","This panel loader is designed to load the panel when the container (the advanced panel) becomes visible.  This improves performance in cases where the faceplate is called but the advanced panel is never displayed.  ","Questo caricatore di pannelli è progettato per caricare il pannello quando il contenitore (il pannello avanzato) diventa visibile.  Ciò migliora le prestazioni nei casi in cui viene richiamato il faceplate ma il pannello avanzato non viene mai visualizzato.","此面板加载器设计为在容器（高级面板）可见时加载面板。这样可以提高调用面板但从不显示高级面板时的性能。","Dieser Bereichslader wurde entwickelt, um den Bereich zu laden, wenn der Container (der erweiterte Bereich) sichtbar wird. Dies verbessert die Leistung in Fällen, in denen das Faceplate aufgerufen wird, der erweiterte Bereich jedoch nie angezeigt wird.","이 패널 로더는 컨테이너(고급 패널)가 표시될 때 패널을 로드하도록 설계되었습니다.  이렇게 하면 페이스플레이트가 호출되지만 고급 패널이 표시되지 않는 경우 성능이 향상됩니다.","Ce chargeur de panneau est conçu pour charger le panneau lorsque le conteneur (le panneau avancé) devient visible. Cela améliore les performances dans les cas où la façade est appelée mais que le panneau avancé n’est jamais affiché.","Este carregador de painel foi projetado para carregar o painel quando o contêiner (o painel avançado) ficar visível. Isso melhora o desempenho nos casos em que o painel frontal é chamado, mas o painel avançado nunca é exibido.","Este cargador de paneles está diseñado para cargar el panel cuando el contenedor (el panel avanzado) se hace visible. Esto mejora el rendimiento en los casos en los que se llama a la faceplate, pero nunca se muestra el panel avanzado.",
     "This SDK Object is used to add items to combo boxes","This SDK Object is used to add items to combo boxes","Questo oggetto SDK viene utilizzato per aggiungere elementi alle Combo box.","此 SDK 对象用于向组合框添加项目","Dieses SDK-Objekt wird verwendet, um Elemente zu Kombinationsfeldern hinzuzufügen.","이 SDK 개체는 콤보 상자에 항목을 추가하는 데 사용됩니다.","Cet objet SDK est utilisé pour ajouter des éléments aux zones de liste modifiables","Este objeto SDK é usado para adicionar itens a caixas de combinação","Este objeto SDK se usa para agregar elementos a cuadros combinados",
     "Toggle switch with label (above) and text descriptors for false / true states.","Toggle switch with label (above) and text descriptors for false / true states.","Interruttore a levetta con etichetta (sopra) e descrittori di testo per gli stati false/true.","带有标签（上方）和文本说明符的切换开关，用于假/真状态。","Kippschalter mit Beschriftung (oben) und Textbeschreibungen für die Zustände False/True.","레이블(위)과 거짓/참 상태에 대한 텍스트 설명자가 있는 토글 스위치입니다.","Commutateur à bascule avec étiquette (ci-dessus) et descripteurs de texte pour les états faux/vrai.","Seletor com rótulo (acima) e descritores de texto para estados falso / verdadeiro.","Interruptor de palanca con etiqueta (arriba) y descriptores de texto para los estados falso / verdadero.",
     "Toggle switch with label (left) and text descriptors for false / true states.","Toggle switch with label (left) and text descriptors for false / true states.","Interruttore a levetta con etichetta (a sinistra) e descrittori di testo per gli stati false/true.","带有标签（左）和文本说明符的切换开关，用于假/真状态。","Kippschalter mit Beschriftung (links) und Textbeschreibungen für die Zustände False/True.","레이블(왼쪽)과 거짓/참 상태에 대한 텍스트 설명자가 있는 토글 스위치입니다.","Commutateur à bascule avec étiquette (à gauche) et descripteurs de texte pour les états faux/vrai.","Seletor com rótulo (esquerda) e descritores de texto para estados falso / verdadeiro.","Interruptor de palanca con etiqueta (izquierda) y descriptores de texto para los estados falso / verdadero.",
     "Toggle switch with text descriptors for false / true states.","Toggle switch with text descriptors for false / true states.","Interruttore a levetta con descrittori di testo per gli stati false/true.","带有用于假/真状态文本说明符的切换开关。","Kippschalter mit Textbeschreibungen für die Zustände False/True.","거짓/참 상태에 대한 텍스트 설명자가 있는 토글 스위치입니다.","Commutateur à bascule avec descripteurs de texte pour les états faux/vrai.","Seletor com descritores de texto para estados falso / verdadeiro.","Interruptor de palanca con descriptores de texto para los estados falso / verdadero.",
