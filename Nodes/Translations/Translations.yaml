     "Momentary button with icon: Press value = 1, Release value = 0.","Momentary button with icon: Press value = 1, Release value = 0.","Pulsante momentaneo con icona: Valore di pressione = 1, valore di rilascio = 0.","带图标的瞬时按钮：按下值 = 1，释放值 = 0。","Taster mit Symbol: Wert bei Drücken = 1, Wert bei Loslassen = 0.","아이콘이 있는 순간 버튼: 누름 값 = 1, 놓음 값 = 0입니다.","Bouton momentané avec icône : Valeur d’appui = 1, valeur de relâchement = 0.","Botão momentâneo com ícone: valor ao pressionar = 1, valor ao soltar = 0.","Botón momentáneo con icono: Valor de pulsación = 1, Valor de liberación = 0.",
