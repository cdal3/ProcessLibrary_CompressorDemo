     "Ramp time is automatically calculated to use the fastest allowed ramp rate when a new target setpoint is entered. To retrigger this calculation, enter 0 (zero) for the ramp time.","Ramp time is automatically calculated to use the fastest allowed ramp rate when a new target setpoint is entered. To retrigger this calculation, enter 0 (zero) for the ramp time.","Il tempo di rampa viene calcolato automaticamente per utilizzare la velocità di rampa più veloce consentita quando viene immesso un nuovo set point target.Per riattivare questo calcolo, immettere 0 (zero) per il tempo di rampa.","当输入新的目标设置点时，爬坡时间将使用允许的最快爬坡率自动计算。要重新触发此计算，请将爬坡时间设置为 0（零）。","Die Rampenzeit wird automatisch so berechnet, dass die schnellste zulässige Rampenrate verwendet wird, wenn ein neuer Sollwert eingegeben wird. Um diese Berechnung erneut zu starten, geben Sie 0 (Null) als Rampenzeit ein.","램프 시간은 새 설정값이 입력되면 허용된 가장 빠른 램프 속도로 자동 계산됩니다. 이 계산을 다시 실행하려면 램프 시간에 0(영)을 입력하세요.","Temps de rampe automatiquement calculé pour utiliser vitesse rampe la plus rapide autorisée lorsque nouvealleconsigne saisie. Pour relancer calcul, saisissez 0 (zéro) pour durée rampe.","O tempo de rampa é calculado automaticamente para utilizar a taxa de rampa mais rápida permitida quando um novo valor de referência de destino é inserido. Para recalcular este valor, insira 0 (zero) para o tempo de rampa.","El tiempo de rampa se calcula automáticamente para utilizar la velocidad de rampa permitida más rápida cuando se ingresa un nuevo punto de ajuste de destino. Para volver a calcular este valor, ingrese 0 (cero) para el tiempo de rampa.",
