     "Navigate to dialog box explicitly. The instruction backing tag is linked to Ref_Tag, and the dialog box is specified by Cfg_DialogBox.","Navigate to dialog box explicitly. The instruction backing tag is linked to Ref_Tag, and the dialog box is specified by Cfg_DialogBox.","Passare alla finestra di dialogo in modo esplicito. Il tag di backup dell'istruzione è collegato a Ref_Tag e la finestra di dialogo è specificata da Cfg_DialogBox.","显式导航到对话框。指令备用标签链接到 Ref_Tag，且对话框由 Cfg_DialogBox 指定。","Explizit zum Dialogfeld navigieren. Das Anweisungs-Backing-Tag ist mit Ref_Tag verknüpft, und das Dialogfeld wird durch Cfg_DialogBox angegeben.","명시적으로 대화 상자로 이동합니다. 명령어 지원 태그는 Ref_Tag에 연결되고, 대화 상자는 Cfg_DialogBox로 지정됩니다.","Accéder explicitement à la boîte de dialogue. La balise de sauvegarde de l’instruction est liée à Ref_Tag, et la boîte de dialogue est spécifiée par Cfg_DialogBox.","Navegue até a caixa de diálogo explicitamente. A tag de apoio da instrução está vinculada a Ref_Tag, e a caixa de diálogo é especificada por Cfg_DialogBox.","Vaya al cuadro de diálogo explícitamente. La etiqueta de respaldo de la instrucción está vinculada a Ref_Tag y el cuadro de diálogo se especifica mediante Cfg_DialogBox.",
     "Navigate to EH_Flowmeter faceplate from parent faceplate","Navigate to EH_Flowmeter faceplate from parent faceplate","Passa a EH_Flowmeter faceplate dal faceplate principale","从父面板导航到 EH_Flowmeter 面板","Vom übergeordneten Faceplate zu EH_FlowmeterFaceplate navigieren","상위 페이스플레이트에서 EH_Flowmeter 페이스플레이트로 이동합니다.","Accéder à la façade EH_Flowmeter à partir de la façade parente.","Navegue até o painel frontal EH_Flowmeter a partir do painel frontal pai","Navegue al faceplate EH_Flowmeter desde el faceplate principal",
     "Navigate to faceplate using string.  String variable linked to Ref_Nav contains the full path to an instruction backing tag. The dialog box name is derived from data in the instruction backing tag.","Navigate to faceplate using string.  String variable linked to Ref_Nav contains the full path to an instruction backing tag. The dialog box name is derived from data in the instruction backing tag.","Passare al faceplate usando la stringa.  La variabile stringa collegata a Ref_Nav contiene il percorso completo a un tag di backing dell'istruzione.Il nome della finestra di dialogo viene ricavato dai dati presenti nel tag di backing dell'istruzione.","通过字符串导航至面板。链接到 Ref_Nav 的字符串变量包含指令备用标签的完整路径。对话框名称来源于指令支持标签中的数据。","Mit einer Zeichenfolge zur Faceplate navigieren. Die mit Ref_Nav verknüpfte Zeichenfolgenvariable enthält den vollständigen Pfad zu einem Instruktions-Backing-Tag. Der Name des Dialogfelds wird aus den Daten im Instruktions-Backing-Tag abgeleitet.","문자열을 사용하여 페이스플레이트로 이동합니다. Ref_Nav에 연결된 문자열 변수에는 명령어 지원 태그의 전체 경로가 포함되어 있으며, 대화 상자 이름은 명령어 지원 태그의 데이터에서 파생됩니다.","Accéder à la façade à l’aide d’une chaîne. La variable de chaîne liée à Ref_Nav contient le chemin complet vers une balise de sauvegarde d’instruction. Le nom de la boîte de dialogue est dérivé des données de la balise de sauvegarde d’instruction.","Navegar até o faceplate usando string. A variável String vinculada a Ref_Nav contém o caminho completo para uma tag de apoio da instrução. O nome da caixa de diálogo é derivado dos dados na tag de apoio da instrução.","Navegue al faceplate usando String. La variable String vinculada a Ref_Nav contiene la ruta completa a una tag de respaldo de instrucción. El nombre del cuadro de diálogo se deriva de los datos de la tag de respaldo de la instrucción.",
     "Navigate to faceplate using suffix.  Ref_BaseTag is linked to the current instruction backing tag.  The target tagname and path is derived from the base tag and suffix combined.  The dialog box name is derived from data in the target backing tag.","Navigate to faceplate using suffix.  Ref_BaseTag is linked to the current instruction backing tag.  The target tagname and path is derived from the base tag and suffix combined.  The dialog box name is derived from data in the target backing tag.","Passare al faceplate utilizzando il suffisso.  Ref_BaseTag è collegato al tag di backing dell'istruzione corrente.Il nome tag e il percorso di destinazione sono ricavati dalla combinazione del tag di base e del suffisso.Il nome della finestra di dialogo deriva dai dati nel tag di backing di destinazione.","使用后缀导航到面板。Ref_BaseTag 链接到当前指令支持标签。目标标签名称和路径派生自基本标签和后缀的组合。对话框名称派生自目标支持标签中的数据。","Mit dem Suffix zur Faceplate navigieren. Ref_BaseTag ist mit dem aktuellen Instruktions-Backing-Tag verknüpft. Der Ziel-Tagname und -Pfad werden aus der Kombination von Basis-Tag und Suffix abgeleitet. Der Name des Dialogfelds wird von den Daten im Ziel-Instruktions-Backing-Tag abgeleitet.","접미사를 사용하여 페이스플레이트로 이동합니다. Ref_BaseTag는 현재 명령어 지원 태그에 연결되어 있습니다. 대상 태그 이름과 경로는 기본 태그와 접미사가 결합되어 파생됩니다. 대화 상자 이름은 대상 지원 태그의 데이터에서 파생됩니다.","Accéder à la façade à l’aide du suffixe. Ref_BaseTag est liée à la balise de sauvegarde de l’instruction courante. Le nom de la balise cible et le chemin sont dérivés de la combinaison de la balise de base et du suffixe. Le nom de la boîte de dialogue est dérivé des données de la balise de sauvegarde cible.","Navegue até o faceplate usando o sufixo. Ref_BaseTag está vinculado à tag de apoio da instrução atual. O nome e o caminho da tag de destino são derivados da tag base e do sufixo combinados. O nome da caixa de diálogo é derivado dos dados na tag de apoio de destino.","Navegue al faceplate usando el sufijo. Ref_BaseTag está vinculada a la tag de respaldo de instrucción actual. El nombre y la ruta de la tag de destino se derivan de la combinación de la tag base y el sufijo. El nombre del cuadro de diálogo se deriva de los datos de la tag de respaldo de destino.",
     "Navigate to faceplate using tag.  The instruction backing tag is linked to Ref_Tag, and the dialog box name is derived from data stored in the instruction backing tag.","Navigate to faceplate using tag.  The instruction backing tag is linked to Ref_Tag, and the dialog box name is derived from data stored in the instruction backing tag.","Passare al faceplate utilizzando il tag.  Il tag di backing dell'istruzione è collegato a Ref_Tag e il nome della finestra di dialogo deriva dai dati memorizzati nel tag di backing dell'istruzione.","使用标签导航到面板。指令背衬标签链接到 Ref_Tag，对话框名称派生自指令支持标签中存储的数据。","Mit einem Tag zur Faceplate navigieren. Das Instruktions-Backing-Tag ist mit Ref_Tag verknüpft, und der Dialogfeldname wird aus den im Instruktions-Backing-Tag gespeicherten Daten abgeleitet.","태그를 사용하여 페이스플레이트로 이동합니다. 명령 지원 태그는 Ref_Tag에 연결되고, 대화 상자 이름은 명령 지원 태그에 저장된 데이터에서 파생됩니다.","Accéder à la façade à l’aide d’une balise. La balise de sauvegarde de l’instruction est liée à Ref_Tag et le nom de la boîte de dialogue est dérivé des données stockées dans la balise de sauvegarde de l’instruction.","Navegue até o painel frontal usando a tag. A tag de apoio da instrução está vinculada a Ref_Tag e o nome da caixa de diálogo é derivado dos dados armazenados na tag de apoio da instrução.","Navegue al faceplate usando la etiqueta. La etiqueta de respaldo de instrucción está vinculada a Ref_Tag y el nombre del cuadro de diálogo se deriva de los datos almacenados en la etiqueta de respaldo de instrucción.",
     "Navigate to PRI (Restart Inhibit) faceplate from parent faceplate","Navigate to PRI (Restart Inhibit) faceplate from parent faceplate","Passare alla maschera PRI (Restart Inhibit) dalla maschera principale","从父面板导航到 PRI（重新启动禁用）面板","Vom übergeordneten Faceplate zur PRI-Faceplate (Restart Inhibit) navigieren","상위 페이스플레이트에서 PRI(Restart Inhibit) 페이스플레이트로 이동합니다.","Accéder à la façade PRI (Restart Inhibit) à partir de la façade parente.","Navegue até o painel frontal PRI (Reiniciar Inibição) a partir do painel frontal pai","Navegue al faceplate PRI (inhibición de reinicio) desde la placa frontal principal.",
     "Navigate to PRT faceplate from parent faceplate","Navigate to PRT faceplate from parent faceplate","Passare alla maschera PRT dalla maschera principale","从父面板导航到 PRT 面板","Vom übergeordneten Faceplate zur PRI-Faceplate navigieren","상위 페이스플레이트에서 PRT 페이스플레이트로 이동합니다.","Accéder à la façade PRT à partir de la façade parente.","Navegue até o painel frontal PRT a partir do painel frontal pai","Navegue al faceplate PRT desde el faceplate principal.",
