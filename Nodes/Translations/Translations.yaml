     "Use this Net Logic script to add additional tag references to the dialog box.  This script assumes that the tags you are adding are suffixes of a base tag used to call this dialog box.","Use this Net Logic script to add additional tag references to the dialog box.  This script assumes that the tags you are adding are suffixes of a base tag used to call this dialog box.","Utilizzare questo script Net Logic per aggiungere ulteriori riferimenti di tag alla finestra di dialogo.  Questo script presuppone che i tag che si stanno aggiungendo siano suffissi di un tag di base utilizzato per chiamare questa finestra di dialogo.","使用此 Net Logic 脚本可以向对话框添加额外的标签引用。 此脚本假定您添加的标签是用于调用此对话框的基本标签的后缀。","Verwenden Sie dieses NetLogic-Skript, um dem Dialogfeld zusätzliche Tag-Verweise hinzuzufügen.  Dieses Skript geht davon aus, dass es sich bei den Tags, die Sie hinzufügen, um Suffixe eines Basistags handelt, das zum Aufrufen dieses Dialogfelds verwendet wird.","이 Net Logic 스크립트를 사용하여 대화 상자에 추가 태그 참조를 추가할 수 있습니다.  이 스크립트에서는 추가하는 태그가 이 대화 상자를 호출하는 데 사용되는 기본 태그의 접미사라고 가정합니다.","Utilisez ce script Net Logic pour ajouter des références de balise supplémentaires à la boîte de dialogue. Ce script suppose que les balises que vous ajoutez sont des suffixes d’une balise de base utilisée pour appeler cette boîte de dialogue.","Use esse script Net Logic para adicionar referências de tag adicionais à caixa de diálogo. Esse script pressupõe que as tags que você está adicionando são sufixos de uma tag base usada para chamar essa caixa de diálogo.","Utilice este script de Net Logic para agregar referencias de tags adicionales al cuadro de diálogo. Este script supone que las tags que está agregando son sufijos de una tag base utilizada para llamar a este cuadro de diálogo.",
     "Use this panel for the Command Source tab on the Advanced display","Use this panel for the Command Source tab on the Advanced display","Utilizzare questo pannello per la scheda Origine comando nella visualizzazione Avanzata","将此面板用于“高级”显示上的“命令源”选项卡","\"Diesen Bereich für die Registerkarte \"\"Befehlsquelle\"\" in der Anzeige \"\"Erweitert\"\" verwenden\"","고급 디스플레이의 명령 소스 탭에 이 패널을 사용하십시오.","Utilisez ce panneau pour l’onglet Source de commande de l’écran Avancé","Use este painel para a guia Origem do comando na exibição Avançada","Utilice este panel para la pestaña Origen de comandos de la pantalla avanzada",
