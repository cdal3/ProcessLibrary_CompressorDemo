     "Enabling data collection will affect communication and processor performance. Be sure to disable data collection when you are finished monitoring the controller.","Enabling data collection will affect communication and processor performance. Be sure to disable data collection when you are finished monitoring the controller.","L'abilitazione della raccolta dei dati influirà sulla comunicazione e sulle prestazioni del processore. Assicurati di disabilitare la raccolta dei dati al termine del monitoraggio del controller","使能数据采集将影响通信和处理器性能。完成控制器监视后，请确保禁用数据采集。","Die Aktivierung der Datenerfassung hat Auswirkungen auf die Kommunikation und Prozessorleistung. Stellen Sie sicher, dass Sie die Datenerfassung nach Beendigung der Steuerungsüberwachung deaktivieren.","데이터 수집을 활성화하면 통신과 프로세서 성능에 영향을 줍니다.  컨트롤러 모니터링을 완료하면 데이터 수집을 비활성화하십시오","Activation collecte données affectera performances communication et processeur. Désactiver collecte données en fin surveillance contrôleur.","A ativação da coleta de dados afetará a comunicação e o desempenho do processador. Desative a coleta de dados ao terminar de monitorar o controlador.","Habilitar la recopilación de datos afectará al rendimiento de comunicación y procesador. Asegúrese de deshabilitar la recopilación de datos después de finalizar el monitoreo del controlador.",
